<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Landing Form</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #f3f3fb;
      padding: 40px 0;
    }

    .form-wrapper, .success-message {
      max-width: 600px;
      margin: auto;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #4a148c;
      margin-bottom: 30px;
    }

    .form-field {
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #5e35b1;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      height: 80px;
      resize: none;
    }

    select {
      background-color: #fff;
    }

    .gender-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .gender-group label {
      font-weight: normal;
      color: #333;
    }

    input[type="radio"] {
      accent-color: #6a1b9a;
    }

    .submit-btn, .resubmit-btn {
      background-color: #6a1b9a;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      display: block;
      margin: 20px auto 0;
      text-align: center;
    }

    .submit-btn:hover, .resubmit-btn:hover {
      background-color: #4a148c;
    }

    .success-message {
      display: none;
      text-align: center;
    }

    #submitToggle {
      display: none;
    }

    #submitToggle:checked ~ .form-wrapper {
      display: none;
    }

    #submitToggle:checked ~ .success-message {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Hidden checkbox toggle -->
  <input type="checkbox" id="submitToggle" />

  <!-- Form Section -->
  <div class="form-wrapper">
    <h2>Landing Form</h2>
    <form id="landingForm" onsubmit="document.getElementById('submitToggle').checked=true; return false;">
      <div class="form-field">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required>
      </div>

      <div class="form-field">
        <label for="contact">Contact Number</label>
        <input type="tel" id="contact" name="contact" required>
      </div>

      <div class="form-field">
        <label for="address">Address</label>
        <textarea id="address" name="address" required></textarea>
      </div>

      <div class="form-field">
        <label for="company">Company Name</label>
        <input type="text" id="company" name="company" required>
      </div>

      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-field">
        <label for="department">Department</label>
        <select id="department" name="department" required>
          <option value="">-- Select Department --</option>
          <option value="HR">HR</option>
          <option value="Sales">Sales</option>
          <option value="Development">Development</option>
          <option value="Marketing">Marketing</option>
          <option value="Others">Others</option>
        </select>
      </div>

      <div class="form-field">
        <label>Gender</label>
        <div class="gender-group">
          <label><input type="radio" name="gender" value="Male" required> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label>
        </div>
      </div>

      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>

  <!-- Success Message Section -->
  <div class="success-message">
    <h2>✅ You successfully submitted!</h2>
    <p>Would you like to submit another response?</p>
    <!-- This will uncheck the toggle and reset the form -->
    <label for="submitToggle" class="resubmit-btn" onclick="document.getElementById('landingForm').reset();">Submit Another Response</label>
  </div>

</body>
</html>
